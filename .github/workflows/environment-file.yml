name: Dynamic Environment Variable Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  env-demo-job:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Write the variable to $GITHUB_ENV
      - name: Generate and Set Variable
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          echo "CURRENT_DATE=$BUILD_DATE" >> "$GITHUB_ENV"
          echo "APP_VERSION=v1.2.3" >> "$GITHUB_ENV"

      # Step 2: Access the variables set in Step 1
      - name: Read Variables in Later Step
        run: |
          echo "The build date is: $CURRENT_DATE"
          echo "The app version is: ${{ env.APP_VERSION }}"
