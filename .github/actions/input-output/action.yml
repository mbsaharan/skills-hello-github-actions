name: Clean Greeting Action
description: Generates and outputs a welcome message without cluttering logs

inputs:
  name-to-greet:
    description: Who to say hello to
    required: true
    default: World

outputs:
  formatted-message:
    description: The generated greeting string
    value: ${{ steps.generate-text.outputs.greeting-out }}

runs:
  using: composite
  steps:
    - id: generate-text
      # Quietly compute and set output; no console output here!
      run: |
        TEXT="Hello, ${{ inputs.name-to-greet }}! Generated at $(date)."
        echo "greeting-out=$TEXT" >> $GITHUB_OUTPUT
      shell: bash
