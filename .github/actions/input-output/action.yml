name: Simple Greeting Action
description: Generates and outputs a welcome message

inputs:
  name-to-greet:
    description: Who to say hello to
    required: true
    default: World

# 1. Declare the output key that external workflows can read
outputs:
  formatted-message:
    description: The generated greeting string
    value: ${{ steps.generate-text.outputs.greeting-out }}

runs:
  using: composite
  steps:
    - id: generate-text
      # 2. Write the key=value pair to the special $GITHUB_OUTPUT file
      run: |
        TEXT="Hello, ${{ inputs.name-to-greet }}! Generated at $(date)."
        echo "greeting-out=$TEXT" >> $GITHUB_OUTPUT
      shell: bash
