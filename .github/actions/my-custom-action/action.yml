name: 'Greeting Generator'
description: 'Generates a customized build status message'
author: 'Developer'

# Define inputs expected from the workflow
inputs:
  user-name:
    description: 'Name of the person to greet'
    required: true
    default: 'Developer'
  environment-type:
    description: 'Target environment'
    required: false
    default: 'Staging'

# Define outputs passed back to the workflow
outputs:
  greeting-message:
    description: 'The formatted greeting text'
    value: ${{ steps.build-message.outputs.result }}

# Define the runner type and execution steps (Composite Action)
runs:
  using: 'composite'
  steps:
    - id: build-message
      run: |
        MSG="Hello ${{ inputs.user-name }}, preparing deployment for ${{ inputs.environment-type }}!"
        echo "result=$MSG" >> $GITHUB_OUTPUT
      shell: bash
